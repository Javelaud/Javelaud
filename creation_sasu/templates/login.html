<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Javelaud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Cormorant Garamond', 'Georgia', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            gold: { 400:'#e3b143', 500:'#d4952a', 600:'#c9841f', 700:'#a6681b' },
            navy: { 900:'#0f172a', 950:'#080d1a' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    input:focus { outline: none; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #d4952a; }
  </style>
</head>

<body class="h-full bg-navy-950 flex items-center justify-center p-4">

  <!-- Background pattern -->
  <div class="absolute inset-0 overflow-hidden">
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-gold-600/5 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-blue-600/5 rounded-full blur-3xl"></div>
  </div>

  <div class="relative w-full max-w-md">

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">

      <!-- Header -->
      <div class="bg-navy-900 px-8 py-10 text-center relative">
        <div class="w-12 h-12 rounded-xl bg-gold-600 flex items-center justify-center mx-auto mb-4">
          <span class="text-white font-serif font-bold text-xl">J</span>
        </div>
        <h1 class="font-serif text-3xl text-white font-semibold">Javelaud</h1>
        <p class="text-white/50 text-sm mt-2 font-light tracking-wide">CRÉATION DE SOCIÉTÉ EN LIGNE</p>

        <!-- Decorative line -->
        <div class="flex items-center gap-3 mt-6 justify-center">
          <div class="h-px w-12 bg-gold-600/40"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-gold-600/60"></div>
          <div class="h-px w-12 bg-gold-600/40"></div>
        </div>
      </div>

      <!-- Form -->
      <div class="px-8 py-8">
        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 text-sm mb-6 flex items-center gap-2">
          <svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
          </svg>
          {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/login" class="space-y-5">
          <div>
            <label for="email" class="block text-sm font-medium text-slate-700 mb-1.5">
              Adresse email
            </label>
            <input type="email" id="email" name="email" required
                   autocomplete="email"
                   placeholder="vous@exemple.fr"
                   class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm text-slate-900 bg-slate-50 placeholder-slate-400 transition-all">
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">
              Mot de passe
            </label>
            <input type="password" id="password" name="password" required
                   autocomplete="current-password"
                   placeholder="••••••••"
                   class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm text-slate-900 bg-slate-50 placeholder-slate-400 transition-all">
          </div>

          <button type="submit"
                  class="w-full bg-navy-900 hover:bg-slate-800 text-white font-semibold py-3 px-6 rounded-xl text-sm transition-all flex items-center justify-center gap-2 mt-2">
            Se connecter
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </button>
        </form>

        <div class="mt-6 pt-6 border-t border-slate-100 text-center">
          <p class="text-slate-500 text-xs leading-relaxed">
            Vous avez reçu une invitation ? Consultez votre email<br>pour activer votre espace client.
          </p>
        </div>
      </div>
    </div>

    <!-- Bottom tagline -->
    <p class="text-center text-white/20 text-xs mt-6">
      Cabinet Javelaud — Expertise juridique & création d'entreprise
    </p>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activez votre espace — Javelaud</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-logo">Javelaud</h1>
        <p class="auth-subtitle">Activation de votre espace</p>
      </div>

      <div class="welcome-message">
        <p>Bonjour <strong>{{ prenom }}</strong>,</p>
        <p>Choisissez un mot de passe pour accéder à votre espace de création de SASU.</p>
      </div>

      {% if error %}
      <div class="alert alert-error">{{ error }}</div>
      {% endif %}

      <form method="post" action="/invitation/{{ token }}" class="auth-form">
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" required
                 placeholder="8 caractères minimum" minlength="8" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="password_confirm">Confirmer le mot de passe</label>
          <input type="password" id="password_confirm" name="password_confirm" required
                 placeholder="••••••••" minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-full">
          Activer mon espace →
        </button>
      </form>
    </div>
  </div>
</body>
</html>
